[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:dockerd]
command=/usr/bin/dockerd --data-root=/data/docker
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgresql
user=postgres
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --appendonly yes --bind 127.0.0.1
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:clickhouse]
command=/usr/local/bin/clickhouse server --config-file=/etc/clickhouse-server/config.xml
user=clickhouse
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:kafka]
command=/opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:qdrant]
command=/usr/local/bin/qdrant --config-path /etc/qdrant/config.yaml
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bootstrap]
command=/usr/local/bin/bootstrap.sh
autorestart=false
startsecs=0
exitcodes=0
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Loads the pre-built indexer image (docker import, no compiling). Runs
; independently of the app services below so dockerd startup never blocks them.
[program:load-indexer]
command=/usr/local/bin/load-indexer.sh
autorestart=false
startsecs=0
exitcodes=0
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth-service]
command=/usr/local/bin/wait-and-run.sh node /app/apps/auth-service/dist/index.js
directory=/app/apps/auth-service
autorestart=true
priority=60
environment=NODE_ENV="production",PORT="4000",CLIENT_URL="%(ENV_PUBLIC_URL)s",DATABASE_URL="postgresql://repo_chat:repo_chat@localhost:5432/auth_service",REDIS_URL="redis://localhost:6379",SESSION_SECRET="%(ENV_SESSION_SECRET)s",SESSION_COOKIE_SECURE="false"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:repository-service]
command=/usr/local/bin/wait-and-run.sh node /app/apps/repository-service/dist/index.js
directory=/app/apps/repository-service
autorestart=true
priority=60
environment=NODE_ENV="production",PORT="4001",CLIENT_URL="%(ENV_PUBLIC_URL)s",DATABASE_URL="postgresql://repo_chat:repo_chat@localhost:5432/repository_service",CLICKHOUSE_URL="http://localhost:8123/repository_service",CLICKHOUSE_ADMIN="default",CLICKHOUSE_PASSWORD="repo_chat",KAFKA_BROKER="localhost:9092",KAFKA_SSL="false",KAFKA_SASL="false",QDRANT_URL="http://localhost:6333",CHAT_SERVICE_URL="http://localhost:4002",DOCKER_SOCKET_PATH="/var/run/docker.sock",INDEXING_IMAGE="repo-chat-indexer",INDEXING_NETWORK_MODE="host",WAIT_FOR_INDEXER="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chat-service]
command=/usr/local/bin/wait-and-run.sh node /app/apps/chat-service/dist/index.js
directory=/app/apps/chat-service
autorestart=true
priority=60
environment=NODE_ENV="production",PORT="4002",CLIENT_URL="%(ENV_PUBLIC_URL)s",DATABASE_URL="postgresql://repo_chat:repo_chat@localhost:5432/chat_service",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",AI_GATEWAY_API_KEY="%(ENV_AI_GATEWAY_API_KEY)s",QDRANT_URL="http://localhost:6333",REPOSITORY_SERVICE_URL="http://localhost:4001"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api-gateway]
command=/usr/local/bin/wait-and-run.sh node /app/apps/api-gateway/dist/index.js
directory=/app/apps/api-gateway
autorestart=true
priority=70
environment=NODE_ENV="production",PORT="3000",CLIENT_URL="%(ENV_PUBLIC_URL)s",AUTH_SERVICE_URL="http://localhost:4000",REPOSITORY_SERVICE_URL="http://localhost:4001",CHAT_SERVICE_URL="http://localhost:4002",FRONTEND_DIR="/app/apps/frontend/dist"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
